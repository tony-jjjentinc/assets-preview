<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="https://cdn.jsdelivr.net/gh/tony-jjjentinc/assets@main/images/logo/base-light.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Assets Preview</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script>
      (function() {
        var group = localStorage.getItem('themeGroup') || 'jjjei_gmo:0';
        var cacheBuster = Date.now();
        var style = document.createElement('style');
        style.id = 'dynamic-theme';
        document.head.appendChild(style);
        fetch('https://raw.githubusercontent.com/tony-jjjentinc/assets/main/colors/v2/' + group + '.css?t=' + cacheBuster)
          .then(res => res.text())
          .then(css => { 
             var modifiedCss = css.replace(/linear-gradient\(225deg,\s*(#[a-fA-F0-9]{3,6})\s*0%,\s*(#[a-fA-F0-9]{3,6})\s*100%\)/g, 'linear-gradient(225deg, $2 0%, $1 100%)');
             style.textContent = modifiedCss; 
          });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
